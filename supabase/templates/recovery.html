<h2>Reset your password</h2>
<p>Click the link below to choose a new password for your Recall account.</p>
<p>
  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/reset-password/update">Choose a new password</a>
</p>
<p>If you didn't ask for this, you can ignore it — your password will not change.</p>
